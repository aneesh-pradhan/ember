[package]
name = "ember"
version = "0.5.0"
edition = "2021"
description = "A terminal coding agent powered by NVIDIA Nemotron on Nebius Token Factory"
license = "MIT"
repository = "https://github.com/aneesh-pradhan/ember"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
dotenvy = "0.15"
futures-util = "0.3"
ignore = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
