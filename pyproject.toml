[project]
name = "failfirst"
version = "0.1.0"
description = "An agent that proves a bug with a failing test before it fixes it. Nemotron on Nebius Token Factory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "contree-sdk==0.3.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
failfirst = "failfirst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["failfirst"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
